<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - Dar3a Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-image-large {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--bg-tertiary);
        }
        .product-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info-detail h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .product-info-detail .price {
            font-size: 1.8rem;
            color: var(--accent);
            font-weight: 900;
        }
        .product-info-detail .specs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }
        .product-info-detail .specs span {
            background: var(--bg-tertiary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .product-info-detail .description {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin: 15px 0;
        }
        .product-info-detail .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .product-info-detail .actions .btn {
            flex: 1;
            padding: 12px 24px;
        }
        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .product-image-large {
                height: 300px;
            }
            .product-info-detail h1 {
                font-size: 1.5rem;
            }
            .product-info-detail .price {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon"><i class="fas fa-shield-halved"></i></span>
                <span class="logo-text">Dar3a Store</span>
            </a>
            <div class="nav-actions">
                <button class="nav-btn" id="cart-btn"><i class="fas fa-shopping-cart"></i></button>
                <a href="index.html" class="btn btn-primary btn-sm">العودة</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="product-detail" id="product-detail">
            <div class="product-image-large" id="product-image">
                <img src="https://via.placeholder.com/600" alt="منتج">
            </div>
            <div class="product-info-detail" id="product-info">
                <h1 id="product-name">اسم المنتج</h1>
                <div class="price" id="product-price">0 ج.س</div>
                <div class="specs" id="product-specs"></div>
                <div class="description" id="product-description">وصف المنتج</div>
                <div class="actions">
                    <button class="btn btn-primary" id="add-to-cart-btn">
                        <i class="fas fa-cart-plus"></i> إضافة للسلة
                    </button>
                    <button class="btn btn-whatsapp" id="buy-now-btn">
                        <i class="fab fa-whatsapp"></i> شراء مباشر
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productId = new URLSearchParams(window.location.search).get('id');

        async function loadProduct() {
            try {
                const response = await fetch(`/api/products/${productId}`);
                const product = await response.json();
                
                document.getElementById('product-image').innerHTML = `<img src="${product.image || 'https://via.placeholder.com/600'}" alt="${product.name}">`;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-price').textContent = `${product.price.toLocaleString()} ج.س`;
                document.getElementById('product-description').textContent = product.description || 'لا يوجد وصف';
                
                if (product.specs) {
                    const specsHtml = Object.entries(product.specs).map(([k, v]) => 
                        `<span>${k}: ${v}</span>`
                    ).join('');
                    document.getElementById('product-specs').innerHTML = specsHtml;
                }
                
                document.getElementById('add-to-cart-btn').addEventListener('click', () => {
                    let cart = JSON.parse(localStorage.getItem('dar3a_cart') || '[]');
                    const existing = cart.find(i => i.id === product.id);
                    if (existing) {
                        existing.quantity = (existing.quantity || 1) + 1;
                    } else {
                        cart.push({ ...product, quantity: 1 });
                    }
                    localStorage.setItem('dar3a_cart', JSON.stringify(cart));
                    alert('✅ تمت الإضافة للسلة');
                });
                
                document.getElementById('buy-now-btn').addEventListener('click', () => {
                    const message = `🛒 ${product.name}\n💰 ${product.price.toLocaleString()} ج.س`;
                    window.open(`https://wa.me/0922265656?text=${encodeURIComponent(message)}`, '_blank');
                });
                
            } catch (error) {
                console.error('خطأ في تحميل المنتج:', error);
                document.getElementById('product-detail').innerHTML = `
                    <div style="text-align:center;padding:60px;color:var(--text-muted);">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem;display:block;margin-bottom:15px;"></i>
                        <h2>المنتج غير موجود</h2>
                        <a href="index.html" class="btn btn-primary" style="margin-top:20px;">العودة</a>
                    </div>
                `;
            }
        }

        loadProduct();
    </script>
</body>
</html>
