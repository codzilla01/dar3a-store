name: CI — جودة وأمان Dar3a Store

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Automated security and API tests
        run: npm test
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Secrets scan
        run: |
          ! grep -rnE "[0-9]{8,12}:[A-Za-z0-9_-]{25,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9|service_role[[:space:]]*[:=][[:space:]]*['\"]" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude='.env.example' .
